name: android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Unit tests and debug APK
        run: gradle -p android :core:test :app:assembleDebug --console=plain
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sanafi-probe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sanafi-probe-apk
          path: sanafi-probe.apk
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: probe-${{ github.run_number }}
          name: Sanafi probe build ${{ github.run_number }}
          files: sanafi-probe.apk
          make_latest: true
